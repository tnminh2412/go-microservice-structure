[Service]
Name=EdgeSocial
Domain=service
Port=25051
Expose=true

[Log]
Type=file,console

[ConsoleLogger]
Level=info

[FileLogger]
Path=./
Name=EdgeSocial
Level=info

[TraceLogger]
Enable=false
Name=EdgeSocial
Level=info

[ReqLogger]
Path=./
Name=EdgeSocial
Level=info

[Jaeger]
URI=localhost:14250


; config for grpc client
[CircuitBreaker]
Enable=false
Timeout=2000
MaxConcurrent=100000
Threshold=100
ErrPercentThreshold=80

[Retry]
Num=5
Timeout=100


[RedisConfig]
Redis=localhost:7000
Applications=

[Mongo]
Connection=mongodb://localhost:27017/?replicaSet=rs0
ConnectionName=EdgeSocial
