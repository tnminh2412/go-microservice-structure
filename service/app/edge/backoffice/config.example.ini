[Service]
Name=EdgeBackoffice
Domain=service
Port=25000
Expose=false

[Log]
Type=file,console

[Warn]
Enable=true
After=5

[ConsoleLogger]
Level=warn

[FileLogger]
Path=./
Name=EdgeBackoffice
Level=warn

[TraceLogger]
Enable=true
Name=EdgeBackoffice
Level=warn

[ReqLogger]
Path=./
Name=EdgeBackoffice
Level=warn

[Jaeger]
URI=localhost:14250

; config for grpc client
[CircuitBreaker]
Enable=false
Timeout=2000
MaxConcurrent=100000
Threshold=100
ErrPercentThreshold=80

[Retry]
Num=5
Timeout=100

[RedisCluster]
Scope=localhost:7000
Notify=localhost:7000

[RedisConfig]
Redis=localhost:7000
Applications=

[API]
IntegrationUserService=localhost:24000

[Mongo]
Connection=mongodb://localhost:27017/?replicaSet=rs0
ConnectionName=EdgeEdgeBackoffice

