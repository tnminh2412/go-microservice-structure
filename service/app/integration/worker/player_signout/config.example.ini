[Service]
Name=IntegrationWorkerPlayerSignout
Domain=worker
Port=24008
Expose=true

[Log]
Type=file,console

[ConsoleLogger]
Level=debug

[FileLogger]
Path=./
Name=IntegrationWorkerPlayerSignout
Level=debug

[TraceLogger]
Enable=true
Name=IntegrationWorkerPlayerSignout
Level=debug

[ReqLogger]
Path=./
Name=IntegrationWorkerPlayerSignout
Level=debug

[Jaeger]
URI=localhost:14250


; config for grpc client
[CircuitBreaker]
Enable=false
Timeout=2000
MaxConcurrent=100000
Threshold=100
ErrPercentThreshold=80

[Retry]
Num=5
Timeout=100


[RedisCluster]
Scope=localhost:7000
Player=localhost:7000
SchedulerLock=localhost:7000
Notify=localhost:7000

[Mongo]
Connection=mongodb://localhost:27017/?replicaSet=rs0
ConnectionName=IntegrationWorkerPlayerSignout
