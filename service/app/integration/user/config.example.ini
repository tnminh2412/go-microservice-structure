[Service]
Name=IntegrationUser
Domain=service
Port=24000
Expose=true

[Log]
Type=file,console

[ConsoleLogger]
Level=info

[FileLogger]
Path=./
Name=IntegrationUser
Level=info

[TraceLogger]
Enable=true
Name=IntegrationUser
Level=info

[ReqLogger]
Path=./
Name=IntegrationUser
Level=info

[Jaeger]
URI=localhost:14250

; config for grpc client
[CircuitBreaker]
Enable=false
Timeout=5000
MaxConcurrent=100000
Threshold=100
ErrPercentThreshold=80

[Retry]
Num=5
Timeout=100

[RedisCluster]
Scope=localhost:7000
User=localhost:7000

[API]
UserService=localhost:23007
CommunicationService=localhost:23019

[Mongo]
Connection=mongodb://localhost:27017/?replicaSet=rs0
ConnectionName=IntegrationIntegrationUser

[Security]
; Secret used to sign OTP-reset tokens
OtpResetSecret=
