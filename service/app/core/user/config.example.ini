[Service]
Name=CoreUser
Domain=service
Port=23007
Expose=true

[Log]
Type=file,console

[ConsoleLogger]
Level=info

[FileLogger]
Path=./
Name=CoreUser
Level=info

[TraceLogger]
Enable=true
Name=CoreUser
Level=info

[ReqLogger]
Path=./
Name=CoreUser
Level=info

[Jaeger]
URI=localhost:14250

; config for grpc client
[CircuitBreaker]
Enable=false
Timeout=2000
MaxConcurrent=100000
Threshold=100
ErrPercentThreshold=80

[Retry]
Num=5
Timeout=100

[RedisCluster]
Scope=localhost:7000

[Mongo]
Connection=mongodb://localhost:27017/?replicaSet=rs0
ConnectionName=CoreCoreUser
